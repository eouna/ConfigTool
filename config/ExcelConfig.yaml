javaTemplateConf:
  packageName: genpackage
  dataRangeServerSkipStr: client
  dataRangeClientSkipStr: server
  dataManagerClassName: GameDataManager
  dataManagerLoadDataCaller: loadAllData
  baseBeanIdName: id
  keepBindExcelRelativePath: false
syncConfig:
  serverList: 本地(Local),测试服1,测试服2
  localResourcePlacePath: resources/sample
  targetServer:
  - servername: 测试服1
    serverIp: 127.0.0.1
    username: name
    userPass: pass
    port: 22
    serverPath: /
    uploadTempFilePath: /temp/
    executeCommand: cp -r /data/temp/ /destination/
  - servername: 测试服2
    serverIp: 127.0.0.2
    username: name
    userPass: pass
    port: 22
    serverPath: /
    uploadTempFilePath: /data/temp/
    executeCommand: cp -r /data/temp/ /destination/
excelConf:
  fieldRow:
    fieldDescRow: 0
    fieldTypeRow: 1
    fieldNameRow: 2
    fieldDataRangeRow: 3
    isUnderLineTransUpper: false
  constantFieldRow:
    fieldDescCol: 3
    fieldTypeCol: 1
    fieldNameCol: 0
    fieldValCol: 2
  path:
    excelConfigLoadPath: example
    templateFileGenTargetDir: gentemppath/genpackage
    templatePath: ftl
  dataConstantSheetName: constant
cache:
  sqliteConfig:
    enable: false
    user: admin
    pass: pass
jsonTemplateConf:
  isSplitMultiJson: true
