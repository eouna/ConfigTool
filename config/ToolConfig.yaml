exportConf:
  # 导出模式: client=客户端导出(数据范围行标记为server的字段不导出); server=服务端导出(标记为client的字段不导出)
  exportMode: client
javaTemplateConf:
  packageName: genpackage
  dataManagerClassName: GameDataManager
  dataManagerLoadDataCaller: loadAllData
  baseBeanIdName: id
  keepBindExcelRelativePath: false
commonTemplateConf:
  printLoadData: true
syncConfig:
  serverList: 本地(Local),测试服1,测试服2
  localResourcePlacePath: resources/sample
  targetServer:
  - serverName: 测试服1
    serverIp: 127.0.0.1
    username: name
    userPass: pass
    port: 22
    serverPath: /
    uploadTempFilePath: /temp/
    executeCommand: cp -r /data/temp/ /destination/
  - serverName: 测试服2
    serverIp: 127.0.0.2
    username: name
    userPass: pass
    port: 22
    serverPath: /
    uploadTempFilePath: /data/temp/
    executeCommand: cp -r /data/temp/ /destination/
excelConf:
  fieldRow:
    fieldDescRow: 0
    fieldTypeRow: 1
    fieldNameRow: 2
    fieldDataRangeRow: 3
    isUnderLineTransUpper: false
  constantFieldRow:
    fieldDescCol: 3
    fieldTypeCol: 1
    fieldNameCol: 0
    fieldValCol: 2
  path:
    excelConfigLoadPath: example
    templateFileGenTargetDir: gentemppath/genpackage
    templatePath: ftl
  dataConstantSheetName: constant
  # 数据范围行中标识服务端字段的名字(可自定义), 服务端导出时跳过该名字的字段
  dataRangeServerSkipStr: client
  # 数据范围行中标识客户端字段的名字(可自定义), 客户端导出时跳过该名字的字段
  dataRangeClientSkipStr: server
cache:
  sqliteConfig:
    enable: false
    user: admin
    pass: pass
jsonTemplateConf:
  isSplitMultiJson: true
